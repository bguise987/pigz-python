name: CI

# Triggers the workflow on push or pull request events for the main branches
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # Runs the test suite against every supported Python version
  build:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first one
      fail-fast: false
      max-parallel: 4
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v6
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install Tox and any other packages
      run: pip install tox
    - name: Run Tox
      # Run tox using the version of Python in `PATH`
      run: tox -e py

  # Style and static analysis. Runs once rather than once per Python version.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install lint dependencies
      # pytest is needed so pylint can resolve the test suite's imports.
      # These are intentionally unpinned; a new linter release can introduce
      # new checks and turn this job red without any code change.
      run: pip install black flake8 pycodestyle pylint pytest
    - name: Black
      run: black --check --diff pigz_python tests
    - name: Flake8
      run: flake8 --max-line-length=88 pigz_python tests
    - name: Pycodestyle
      run: pycodestyle --max-line-length=88 pigz_python tests
    - name: Pylint
      run: pylint pigz_python tests
